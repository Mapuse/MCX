[package]
name = "mcx"
version = "3.0.0"
edition = "2024"
authors = ["Cudane"]
description = "The official Package Manager for Cudane Linux."

[[bin]]
name = "mcx"
path = "src/main.rs"

[features]
default = []
plugins = []

[dependencies]
tokio = { version = "1.44.0", features = ["full"] }
anyhow = "1.0.96"
thiserror = "2.0.12"

reqwest = { version = "0.12.13", default-features = false, features = ["rustls-tls", "json", "stream"] }
futures-util = "0.3.31"

serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.139"

tar = "0.4.44"
zstd = "0.13.3"
tempfile = "3.27.0"

sha2 = "0.10.8"
regex = "1.11.2"
chrono = { version = "0.4.40", features = ["serde"] }

clap = { version = "4.5.28", features = ["derive"] }
crossterm = "0.28.1"
indicatif = "0.17.11"

directories = "6.0.0"
futures = "0.3.32"
libc = "0.2.186"

memmap2 = "0.9.5"
num_cpus = "1.16.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true